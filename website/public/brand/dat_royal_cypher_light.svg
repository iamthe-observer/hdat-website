<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="purpleDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C1D95"/>
      <stop offset="50%" stop-color="#6D28D9"/>
      <stop offset="100%" stop-color="#7C3AED"/>
    </linearGradient>
    <linearGradient id="goldLightShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DFBA69"/>
      <stop offset="50%" stop-color="#B8860B"/>
      <stop offset="100%" stop-color="#8B6508"/>
    </linearGradient>
    <filter id="shadowLight" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#4C1D95" flood-opacity="0.18"/>
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#B8860B" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Clean Alabaster Background (Matches Site Theme #FAF8F5) -->
  <rect width="1200" height="1200" fill="#FAF8F5"/>

  <!-- Subtle Filigree Rings -->
  <circle cx="600" cy="470" r="410" stroke="#7C3AED" stroke-width="0.75" stroke-opacity="0.2" fill="none"/>
  <circle cx="600" cy="470" r="396" stroke="#B8860B" stroke-width="1.25" stroke-opacity="0.35" stroke-dasharray="3 7" fill="none"/>

  <!-- Star of Ghana at Apex -->
  <g transform="translate(600, 150)">
    <polygon points="0,-24 6,-7 24,-7 10,4 15,22 0,11 -15,22 -10,4 -24,-7 -6,-7" fill="url(#goldLightShine)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FAF8F5"/>
  </g>

  <!-- ==================== MASTER CYPHER (ROYAL VIOLET & GOLD EMBED) ==================== -->
  <g filter="url(#shadowLight)">
    <!-- 1. D -->
    <path d="
      M 280 320 L 340 320 L 340 680 L 280 680 L 280 696 L 390 696 L 390 680 L 360 680 L 360 336 L 390 336 L 390 320 L 280 320 Z
    " fill="url(#purpleDeep)"/>
    <path d="
      M 360 320 
      C 490 320, 535 395, 535 500 
      C 535 605, 490 696, 360 696 
      L 360 668 
      C 465 668, 502 590, 502 500 
      C 502 410, 465 348, 360 348 
      Z
    " fill="url(#purpleDeep)"/>

    <!-- 2. A -->
    <polygon points="594,242 600,220 606,242 462,696 438,696" fill="url(#goldLightShine)"/>
    <polygon points="
      590,220 628,220 760,680 790,680 790,696 710,696 710,680 732,680 638,328 590,220
    " fill="url(#purpleDeep)"/>
    <path d="M 572 220 L 628 220 L 600 202 Z" fill="url(#goldLightShine)"/>
    <rect x="475" y="534" width="220" height="15" rx="1.5" fill="url(#goldLightShine)"/>

    <!-- 3. T -->
    <path d="
      M 680 320 
      L 920 320 
      L 920 358 
      L 906 358 
      L 906 338 
      L 818 338 
      L 818 680 
      L 848 680 
      L 848 696 
      L 762 696 
      L 762 680 
      L 792 680 
      L 792 338 
      L 694 338 
      L 694 358 
      L 680 358 
      Z
    " fill="url(#purpleDeep)"/>
  </g>

  <!-- TYPOGRAPHY -->
  <g text-anchor="middle">
    <line x1="340" y1="840" x2="530" y2="840" stroke="#B8860B" stroke-width="0.8" stroke-opacity="0.35"/>
    <polygon points="600,836 604,840 600,844 596,840" fill="url(#goldLightShine)"/>
    <line x1="670" y1="840" x2="860" y2="840" stroke="#B8860B" stroke-width="0.8" stroke-opacity="0.35"/>

    <text x="600" y="890" 
          font-family="'Cormorant Garamond', 'Cinzel', serif" 
          font-size="36" 
          font-weight="700" 
          letter-spacing="0.26em" 
          fill="#11161B">
      HON. DORCAS AFFO-TOFFEY
    </text>

    <text x="600" y="935" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          letter-spacing="0.38em" 
          fill="#7C3AED">
      MEMBER OF PARLIAMENT · DEPUTY MINISTER OF TRANSPORT
    </text>

    <text x="600" y="968" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.44em" 
          fill="#8A6008">
      REPUBLIC OF GHANA
    </text>
  </g>
</svg>