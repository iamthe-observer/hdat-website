<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="goldPure" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBF0B9"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="70%" stop-color="#AA7C11"/>
      <stop offset="100%" stop-color="#F3DC7C"/>
    </linearGradient>

    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141920"/>
      <stop offset="50%" stop-color="#0E1217"/>
      <stop offset="100%" stop-color="#07090C"/>
    </linearGradient>

    <filter id="crispGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="28" flood-color="#000000" flood-opacity="0.7"/>
      <feDropShadow dx="0" dy="0" stdDeviation="15" flood-color="#D4AF37" flood-opacity="0.18"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#bgGrad)"/>

  <!-- Minimalist Fine-Line Octagon Framing -->
  <polygon points="600,100 950,245 1095,595 950,945 600,1090 250,945 105,595 250,245" 
           stroke="url(#goldPure)" stroke-width="1.2" stroke-opacity="0.25" fill="none"/>
  <polygon points="600,120 935,260 1075,600 935,940 600,1080 265,940 125,600 265,260" 
           stroke="url(#goldPure)" stroke-width="0.6" stroke-opacity="0.12" fill="none" stroke-dasharray="3 6"/>

  <!-- The Architectural DAT Mark -->
  <g filter="url(#crispGlow)">
    
    <!-- Central Apex Emblem (The "A" & "T" Synthesis) -->
    <!-- The outer A-frame -->
    <path d="M 600 230
             L 810 710
             L 765 710
             L 600 325
             L 435 710
             L 390 710
             Z" 
          fill="url(#goldPure)"/>

    <!-- The "T" Horizontal Executive Beam crowning through A -->
    <path d="M 360 360
             L 840 360
             L 840 395
             L 620 395
             L 620 710
             L 580 710
             L 580 395
             L 360 395
             Z"
          fill="url(#goldPure)"/>

    <!-- The "D" Grand Arc: Sweeping from left stem, enclosing the left pavilion -->
    <path d="M 435 360
             C 435 360, 310 400, 310 535
             C 310 670, 435 710, 435 710
             L 410 740
             C 270 740, 260 535, 260 535
             C 260 340, 410 325, 410 325
             Z"
          fill="url(#goldPure)" opacity="0.95"/>

    <!-- Symmetrical Counter-Arc for D harmony (completing the ministerial royal shield) -->
    <path d="M 765 360
             C 765 360, 890 400, 890 535
             C 890 670, 765 710, 765 710
             L 790 740
             C 930 740, 940 535, 940 535
             C 940 340, 790 325, 790 325
             Z"
          fill="url(#goldPure)" opacity="0.95"/>

    <!-- A-Crossbar Architectural Keystone -->
    <polygon points="530,555 670,555 655,585 545,585" fill="url(#goldPure)"/>

    <!-- Royal Crown Accent at Apex -->
    <polygon points="600,180 618,215 600,210 582,215" fill="url(#goldPure)"/>
  </g>

  <!-- Typography -->
  <g text-anchor="middle">
    <text x="600" y="870" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="28" 
          font-weight="700" 
          letter-spacing="0.32em" 
          fill="#FAF8F5">
      DORCAS AFFO-TOFFEY
    </text>

    <!-- Subtitle -->
    <text x="600" y="915" 
          font-family="'JetBrains Mono', monospace" 
          font-size="12" 
          font-weight="600" 
          letter-spacing="0.45em" 
          fill="url(#goldPure)">
      DEPUTY MINISTER · TRANSPORT
    </text>

    <text x="600" y="945" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="11" 
          font-weight="400" 
          letter-spacing="0.25em" 
          fill="#FAF8F5" 
          fill-opacity="0.4">
      PARLIAMENT OF GHANA · JOMORO
    </text>
  </g>
</svg>