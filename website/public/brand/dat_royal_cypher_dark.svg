<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="goldUltra" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF8DC"/>
      <stop offset="15%" stop-color="#F5D77F"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#996515"/>
      <stop offset="85%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#FFF0BE"/>
    </linearGradient>

    <linearGradient id="goldStroke" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF2BF"/>
      <stop offset="50%" stop-color="#D4AF37"/>
      <stop offset="100%" stop-color="#805010"/>
    </linearGradient>

    <linearGradient id="royalViolet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A855F7"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <filter id="masterGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.35"/>
    </filter>

    <radialGradient id="luxBgDark" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#181326"/>
      <stop offset="45%" stop-color="#0F0C18"/>
      <stop offset="80%" stop-color="#08060D"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>
  
  </defs>

  <!-- Luxurious Midnight Imperial Violet Background -->
  <rect width="1200" height="1200" fill="url(#luxBgDark)"/>

  <!-- Subtle Heraldic Geometry -->
  <circle cx="600" cy="470" r="410" stroke="url(#goldStroke)" stroke-width="0.75" stroke-opacity="0.25" fill="none"/>
  <circle cx="600" cy="470" r="396" stroke="url(#goldStroke)" stroke-width="1.25" stroke-opacity="0.35" stroke-dasharray="3 7" fill="none"/>
  <circle cx="600" cy="470" r="382" stroke="url(#goldStroke)" stroke-width="0.5" stroke-opacity="0.15" fill="none"/>

  <!-- Ministerial Black Star of Ghana at Apex -->
  <g transform="translate(600, 150)" filter="url(#masterGlow)">
    <polygon points="0,-24 6,-7 24,-7 10,4 15,22 0,11 -15,22 -10,4 -24,-7 -6,-7" fill="url(#goldUltra)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- ==================== THE MASTER CYPHER "D · A · T" ==================== -->
  <g filter="url(#masterGlow)">

    <!-- 1. D BACKGROUND SECTION (Vertical Spine & Serifs) -->
    <!-- D Left Column -->
    <path d="
      M 280 320 L 340 320 L 340 680 L 280 680 L 280 696 L 390 696 L 390 680 L 360 680 L 360 336 L 390 336 L 390 320 L 280 320 Z
    " fill="url(#goldUltra)"/>

    <!-- D Loop (Curves outward to x: 530, y: 500) -->
    <!-- We cut out the overlap where A's left leg passes OVER it -->
    <path d="
      M 360 320 
      C 490 320, 535 395, 535 500 
      C 535 605, 490 696, 360 696 
      L 360 668 
      C 465 668, 502 590, 502 500 
      C 502 410, 465 348, 360 348 
      Z
    " fill="url(#goldUltra)"/>

    <!-- 2. A BACKGROUND & LEGS -->
    <!-- A Hairline Left Leg (Slanted from 600,220 down to 440,696) -->
    <!-- It passes elegantly OVER the D's inner curve, creating the woven cypher -->
    <polygon points="
      594,242 600,220 606,242 462,696 438,696
    " fill="url(#goldUltra)"/>

    <!-- A Bold Right Stem (Slanted from 600,220 down to 760,696) -->
    <polygon points="
      590,220 628,220 760,680 790,680 790,696 710,696 710,680 732,680 638,328 590,220
    " fill="url(#goldUltra)"/>

    <!-- A Apex Finial Accent -->
    <path d="M 572 220 L 628 220 L 600 202 Z" fill="url(#goldUltra)"/>

    <!-- A Horizontal Crossbar (y: 530 to 546) -->
    <!-- Crossbar weaves UNDER D's rightmost arc and OVER A's right leg to touch T -->
    <rect x="475" y="534" width="220" height="15" rx="1.5" fill="url(#goldUltra)"/>

    <!-- 3. T STRUCTURE (Positioned on the Right: x: 680 to 920, Stem at x: 800) -->
    <!-- T Top Horizontal Canopy (y: 320 to 345) -->
    <path d="
      M 680 320 
      L 920 320 
      L 920 358 
      L 906 358 
      L 906 338 
      L 818 338 
      L 818 680 
      L 848 680 
      L 848 696 
      L 762 696 
      L 762 680 
      L 792 680 
      L 792 338 
      L 694 338 
      L 694 358 
      L 680 358 
      Z
    " fill="url(#goldUltra)"/>

    <!-- WEAVING DETAIL ACCENTS (Micro-gap highlights for 3D metallic feel) -->
    <!-- Highlight where A's left leg passes over D -->
    <line x1="492" y1="530" x2="520" y2="445" stroke="#FFF8DC" stroke-width="1.5" stroke-opacity="0.6"/>
    <!-- Highlight where A's right leg passes under T's crossbar -->
    <line x1="680" y1="338" x2="710" y2="338" stroke="#FFF8DC" stroke-width="1.5" stroke-opacity="0.8"/>
  </g>

  <!-- ==================== STATELY MINISTERIAL TYPOGRAPHY ==================== -->
  <g text-anchor="middle">
    <!-- Fine Horizontal Flourish -->
    <line x1="340" y1="840" x2="530" y2="840" stroke="url(#goldStroke)" stroke-width="0.8" stroke-opacity="0.35"/>
    <polygon points="600,836 604,840 600,844 596,840" fill="url(#goldUltra)"/>
    <circle cx="565" cy="840" r="1.5" fill="url(#goldUltra)"/>
    <circle cx="635" cy="840" r="1.5" fill="url(#goldUltra)"/>
    <line x1="670" y1="840" x2="860" y2="840" stroke="url(#goldStroke)" stroke-width="0.8" stroke-opacity="0.35"/>

    <!-- Name in Didone / Trajan Imperial Capitals -->
    <text x="600" y="890" 
          font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', Georgia, serif" 
          font-size="36" 
          font-weight="600" 
          letter-spacing="0.26em" 
          fill="url(#goldUltra)">
      HON. DORCAS AFFO-TOFFEY
    </text>

    <!-- Subtitle 1: Ministerial Office -->
    <text x="600" y="935" 
          font-family="'Plus Jakarta Sans', 'Inter', sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          letter-spacing="0.38em" 
          fill="#FAF8F5" 
          fill-opacity="0.92">
      MEMBER OF PARLIAMENT · DEPUTY MINISTER OF TRANSPORT
    </text>

    <!-- Subtitle 2: Sovereign Nation -->
    <text x="600" y="968" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.44em" 
          fill="url(#royalViolet)">
      REPUBLIC OF GHANA
    </text>
  </g>
</svg>