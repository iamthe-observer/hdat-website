<svg width="1200" height="1200" viewBox="0 0 1200 1200" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="12%" stop-color="#F5D77F"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#996515"/>
      <stop offset="85%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#FFF5D2"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#FFFDF0"/>
      <stop offset="75%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="purpleRoyalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <radialGradient id="vignetteDark" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#191328"/>
      <stop offset="40%" stop-color="#100C1B"/>
      <stop offset="80%" stop-color="#08060D"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>

    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  
  </defs>

  <!-- Background -->
  <rect width="1200" height="1200" fill="url(#vignetteDark)"/>

  <!-- Delicate Geometric Astrolabe / Solar Rings -->
  <circle cx="600" cy="460" r="410" stroke="url(#goldLuxe)" stroke-width="0.75" stroke-opacity="0.2" fill="none"/>
  <circle cx="600" cy="460" r="396" stroke="url(#goldLuxe)" stroke-width="1.25" stroke-opacity="0.3" stroke-dasharray="3 7" fill="none"/>
  <circle cx="600" cy="460" r="382" stroke="url(#goldLuxe)" stroke-width="0.5" stroke-opacity="0.12" fill="none"/>

  <!-- Ministerial Star of Ghana Crest at Apex -->
  <g transform="translate(600, 140)" filter="url(#royalGlow)">
    <polygon points="0,-24 6,-7 24,-7 10,4 15,22 0,11 -15,22 -10,4 -24,-7 -6,-7" fill="url(#goldLuxe)"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
  </g>

  <!-- ==================== THE MONOGRAM "D · A · T" ==================== -->
  <g filter="url(#royalGlow)">

    <!-- 1. LETTER "D" (Left Wing: x=280 to 520, y=310 to 670) -->
    <!-- D Vertical Spine with Roman serifs -->
    <path d="
      M 285 315 L 345 315 L 345 665 L 285 665 L 285 680 L 395 680 L 395 665 L 365 665 L 365 330 L 395 330 L 395 315 L 285 315 Z
    " fill="url(#goldLuxe)"/>

    <!-- D Graceful Semicircular Bow -->
    <!-- Outer curve spans to x=525, inner curve spans to x=495 -->
    <path d="
      M 365 315 
      C 490 315, 530 390, 530 495 
      C 530 600, 490 680, 365 680 
      L 365 655 
      C 465 655, 498 585, 498 495 
      C 498 405, 465 340, 365 340 
      Z
    " fill="url(#goldLuxe)"/>

    <!-- 2. LETTER "A" (Central Pavilion: Apex at 600,210; Base at 440 to 760, y=680) -->
    <!-- A Left Slender Hairline (weaves over D's inner curve) -->
    <polygon points="
      595,232 600,210 605,232 460,680 436,680
    " fill="url(#goldLuxe)"/>

    <!-- A Bold Right Stem (600,210 down to 760,680) with clean foot serif -->
    <polygon points="
      590,210 626,210 758,665 788,665 788,680 710,680 710,665 730,665 636,320 590,210
    " fill="url(#goldLuxe)"/>

    <!-- A Apex Finial -->
    <path d="M 574 210 L 626 210 L 600 192 Z" fill="url(#goldLuxe)"/>

    <!-- A Horizontal Crossbar (y=525 to 540) -->
    <!-- Elegantly intersects D and anchors to A's right leg -->
    <rect x="475" y="525" width="220" height="15" rx="1.5" fill="url(#goldLuxe)"/>

    <!-- 3. LETTER "T" (Right Wing: x=680 to 915, Stem at x=800, y=315 to 680) -->
    <!-- T Top Horizontal Canopy (perfectly aligned with D's top at y=315) -->
    <path d="
      M 680 315 
      L 915 315 
      L 915 352 
      L 902 352 
      L 902 332 
      L 816 332 
      L 816 665 
      L 846 665 
      L 846 680 
      L 760 680 
      L 760 665 
      L 790 665 
      L 790 332 
      L 693 332 
      L 693 352 
      L 680 352 
      Z
    " fill="url(#goldLuxe)"/>

  </g>

  <!-- ==================== MINISTERIAL TYPOGRAPHY ==================== -->
  <g text-anchor="middle">
    <!-- Divider Line with Diamond & Accents -->
    <line x1="320" y1="835" x2="520" y2="835" stroke="url(#goldLine)" stroke-width="1"/>
    <polygon points="600,830 605,835 600,840 595,835" fill="url(#goldLuxe)"/>
    <circle cx="560" cy="835" r="1.5" fill="url(#goldLuxe)"/>
    <circle cx="640" cy="835" r="1.5" fill="url(#goldLuxe)"/>
    <line x1="680" y1="835" x2="880" y2="835" stroke="url(#goldLine)" stroke-width="1"/>

    <!-- Primary Ministerial Wordmark -->
    <text x="600" y="888" 
          font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" 
          font-size="36" 
          font-weight="600" 
          letter-spacing="0.26em" 
          fill="url(#goldLuxe)">
      HON. DORCAS AFFO-TOFFEY
    </text>

    <!-- Subtitle 1: Official Positions -->
    <text x="600" y="934" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="12.5" 
          font-weight="700" 
          letter-spacing="0.38em" 
          fill="#FAF8F5" 
          fill-opacity="0.92">
      MEMBER OF PARLIAMENT · DEPUTY MINISTER OF TRANSPORT
    </text>

    <!-- Subtitle 2: Sovereign Nation -->
    <text x="600" y="966" 
          font-family="'JetBrains Mono', monospace" 
          font-size="11" 
          font-weight="600" 
          letter-spacing="0.45em" 
          fill="url(#purpleRoyalGrad)">
      REPUBLIC OF GHANA
    </text>
  </g>
</svg>