    <!-- Circular Lettering along Banner -->
    <!-- Top Text: HON. DORCAS AFFO-TOFFEY • REPUBLIC OF GHANA -->
    <text font-family="'Cormorant Garamond', 'Cinzel', serif" font-size="25" font-weight="700" letter-spacing="0.22em" fill="url(#sealGold)">
      <textPath href="#textCircleTop" startOffset="50%" text-anchor="middle">
        HON. DORCAS AFFO-TOFFEY ★ REPUBLIC OF GHANA
      </textPath>
    </text>

    <!-- Bottom Text: MEMBER OF PARLIAMENT • DEPUTY MINISTER OF TRANSPORT -->
    <text font-family="'Plus Jakarta Sans', sans-serif" font-size="16" font-weight="600" letter-spacing="0.28em" fill="#FAF8F5" fill-opacity="0.9">
      <textPath href="#textCircleBottom" startOffset="50%" text-anchor="middle">
        MP FOR JOMORO ◆ DEPUTY MINISTER OF TRANSPORT
      </textPath>
    </text>

    <!-- CENTERPIECE: THE ROYAL MONOGRAM DAT -->
    <g transform="translate(600, 600) scale(0.85) translate(-600, -560)">
      
      <!-- Black Star of Ghana at Monogram Crest -->
      <polygon points="600,240 609,268 638,268 614,285 623,313 600,296 577,313 586,285 562,268 591,268" 
