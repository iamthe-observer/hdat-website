               L 480 370 
               L 480 730 
               L 440 730 
               L 440 746 
               L 520 746 
               L 520 730 
               L 498 730 
               L 498 386 
               L 520 386 
               L 520 370 
               Z" 
            fill="url(#sealGold)"/>

      <path d="M 498 370 
               C 625 370, 705 450, 705 550 
               C 705 650, 625 746, 498 746 
               L 498 718 
               C 605 718, 672 635, 672 550 
               C 672 465, 605 398, 498 398 
               Z" 
            fill="url(#sealGold)"/>

      <!-- Letter A (Central Majestic Triangle) -->
      <!-- Left leg hairline -->
      <polygon points="588,320 600,295 612,320 445,746 410,746" fill="url(#sealGold)"/>

      <!-- Right leg bold stem -->
      <polygon points="590,295 620,295 790,730 815,730 815,746 730,746 730,730 755,730 635,390 590,295" fill="url(#sealGold)"/>

      <!-- A Crossbar -->
      <rect x="475" y="585" width="250" height="16" rx="2" fill="url(#sealGold)"/>

      <!-- Letter T (Imperial Lintel spanning top) -->
      <path d="M 430 372
               L 770 372
               L 770 396
               L 756 396
               L 756 384
               L 444 384
               L 444 396
               L 430 396
               Z" 
            fill="url(#sealGold)"/>
      <!-- T Stem -->
      <rect x="593" y="384" width="14" height="346" fill="url(#sealGold)"/>
      <rect x="575" y="730" width="50" height="16" fill="url(#sealGold)"/>
