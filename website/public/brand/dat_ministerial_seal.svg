    <linearGradient id="purpleDeep" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#261047"/>
      <stop offset="50%" stop-color="#180A2E"/>
      <stop offset="100%" stop-color="#0E051C"/>
    </linearGradient>

    <filter id="sealShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="30" flood-color="#000000" flood-opacity="0.8"/>
      <feDropShadow dx="0" dy="2" stdDeviation="8" flood-color="#E2BA64" flood-opacity="0.25"/>
