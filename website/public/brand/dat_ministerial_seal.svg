    <circle cx="600" cy="600" r="478" stroke="url(#sealGold)" stroke-width="1" stroke-opacity="0.5" fill="none"/>
    <circle cx="600" cy="600" r="468" stroke="url(#sealGold)" stroke-width="1.5" stroke-dasharray="3 7" fill="none"/>

