  <defs>
    <linearGradient id="sealGold" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2"/>
      <stop offset="30%" stop-color="#E2BA64"/>
      <stop offset="60%" stop-color="#9C6B1B"/>
      <stop offset="85%" stop-color="#DDB253"/>
      <stop offset="100%" stop-color="#7A4E08"/>
