<svg width="1400" height="360" viewBox="0 0 1400 360" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    
    <linearGradient id="goldLuxe" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFDF0"/>
      <stop offset="12%" stop-color="#F5D77F"/>
      <stop offset="35%" stop-color="#D4AF37"/>
      <stop offset="65%" stop-color="#996515"/>
      <stop offset="85%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#FFF5D2"/>
    </linearGradient>

    <linearGradient id="goldLight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#E5C158"/>
      <stop offset="100%" stop-color="#996515"/>
    </linearGradient>

    <linearGradient id="goldLine" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#D4AF37" stop-opacity="0"/>
      <stop offset="25%" stop-color="#F5D77F"/>
      <stop offset="50%" stop-color="#FFFDF0"/>
      <stop offset="75%" stop-color="#F5D77F"/>
      <stop offset="100%" stop-color="#D4AF37" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="purpleRoyalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333EA"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#4C1D95"/>
    </linearGradient>

    <radialGradient id="vignetteDark" cx="50%" cy="46%" r="65%">
      <stop offset="0%" stop-color="#191328"/>
      <stop offset="40%" stop-color="#100C1B"/>
      <stop offset="80%" stop-color="#08060D"/>
      <stop offset="100%" stop-color="#030205"/>
    </radialGradient>

    <filter id="royalGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#D4AF37" flood-opacity="0.3"/>
    </filter>
  
  </defs>

  <rect width="1400" height="360" fill="#11161B"/>

  <!-- Left: Monogram Cypher Mark -->
  <g transform="translate(60, 20) scale(0.55)">
    <!-- Star of Ghana -->
    <g transform="translate(300, 50)">
      <polygon points="0,-20 5,-6 20,-6 8,3 12,18 0,9 -12,18 -8,3 -20,-6 -5,-6" fill="url(#goldLuxe)"/>
    </g>

    <!-- D -->
    <path d="M 120 160 L 165 160 L 165 460 L 120 460 L 120 472 L 200 472 L 200 460 L 180 460 L 180 172 L 200 172 L 200 160 L 120 160 Z" fill="url(#goldLuxe)"/>
    <path d="M 180 160 C 275 160, 310 220, 310 310 C 310 400, 275 472, 180 472 L 180 450 C 255 450, 285 390, 285 310 C 285 230, 255 182, 180 182 Z" fill="url(#goldLuxe)"/>

    <!-- A -->
    <polygon points="296,128 300,110 304,128 190,472 170,472" fill="url(#goldLuxe)"/>
    <polygon points="290,110 320,110 425,460 450,460 450,472 385,472 385,460 402,460 328,205 290,110" fill="url(#goldLuxe)"/>
    <path d="M 278 110 L 322 110 L 300 95 Z" fill="url(#goldLuxe)"/>
    <rect x="200" y="335" width="180" height="13" rx="1" fill="url(#goldLuxe)"/>

    <!-- T -->
    <path d="M 360 160 L 530 160 L 530 190 L 518 190 L 518 174 L 455 174 L 455 460 L 480 460 L 480 472 L 415 472 L 415 460 L 435 460 L 435 174 L 372 174 L 372 190 L 360 190 Z" fill="url(#goldLuxe)"/>
  </g>

  <!-- Vertical Divider Line -->
  <line x1="400" y1="60" x2="400" y2="300" stroke="url(#goldLine)" stroke-width="1.5"/>

  <!-- Right: Typography -->
  <g transform="translate(440, 0)">
    <text x="0" y="145" 
          font-family="'Cormorant Garamond', 'Cinzel', Georgia, serif" 
          font-size="52" 
          font-weight="700" 
          letter-spacing="0.14em" 
          fill="#FAF8F5">
      HON. DORCAS AFFO-TOFFEY
    </text>

    <text x="0" y="205" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="19" 
          font-weight="700" 
          letter-spacing="0.28em" 
          fill="#D4AF37">
      MEMBER OF PARLIAMENT · JOMORO CONSTITUENCY
    </text>

    <text x="0" y="248" 
          font-family="'Plus Jakarta Sans', sans-serif" 
          font-size="16" 
          font-weight="500" 
          letter-spacing="0.22em" 
          fill="rgba(250,248,245,0.6)">
      DEPUTY MINISTER OF TRANSPORT · REPUBLIC OF GHANA
    </text>
  </g>
</svg>